name: CI

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write
  pull-requests: write

jobs:
  quality-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install flake8

      - name: Run flake8 lint
        run: flake8 .

      - name: Run pytest (skip fail when no tests)
        run: |
          if python - <<'PY'
          import importlib.util
          import sys
          sys.exit(0 if importlib.util.find_spec('pytest') else 1)
          PY
          then
            set +e
            python -m pytest -q
            code=$?
            set -e
            if [ "$code" -eq 0 ] || [ "$code" -eq 5 ]; then
              echo "Pytest completed (or no tests collected)."
            else
              exit "$code"
            fi
          else
            echo "pytest is not installed. Skipping tests."
          fi

  auto-merge:
    name: Auto merge PR
    runs-on: ubuntu-latest
    needs: quality-and-test
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Merge pull request when checks pass
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              merge_method: 'squash'
            });
